spring:
  application:
    name: study-service
  threads:
    virtual:
      enabled: true
  # Phase 7(DB per Service) 패턴 재사용: study_db를 이 서비스가 직접 소유한다. Tag 마스터
  # 데이터의 정본 소유권은 identity-service로 확정됐지만(docs/Groovy_MSA_도메인경계_재검토.md),
  # StudyTag 매칭 쿼리가 성립하도록 tags 테이블 사본을 이 스키마에도 함께 시드한다(완전한
  # 이벤트 기반 동기화는 아직 없음 — 알려진 한계, 계획 문서 참고).
  datasource:
    url: ${SPRING_DEV_DB_URL:jdbc:mysql://localhost:3306/study_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DEV_DB_USERNAME:study_service}
    password: ${SPRING_DEV_DB_PASSWORD:study_service_local_only_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: StudyHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # MSA 전환: 이 서비스도 Study/Application/Waitlist 관련 알림을 Outbox+Kafka로 발행한다
  # (notification-service가 소비하는 "notification-events" 토픽에 함께 발행).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8082

# identity-service가 발급자다 — 이 서비스는 검증만 한다(calendar/content/notification-service와 동일한 패턴).
jwt:
  jwks-url: ${JWT_JWKS_URL:http://identity-service:8081/.well-known/jwks.json}
  jwks-connect-timeout-ms: ${JWT_JWKS_CONNECT_TIMEOUT_MS:2000}
  jwks-read-timeout-ms: ${JWT_JWKS_READ_TIMEOUT_MS:3000}
  jwks-cache-ttl-seconds: ${JWT_JWKS_CACHE_TTL_SECONDS:300}

# groovy(레거시) SecurityConfig와 동일한 이유(프론트가 credentials: "include"로 직접 호출).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# leaderName/applicantName 배치 조회(UserServiceClient) + 선호 태그 조회(TagPreferenceClient,
# Tag 소유권 확정 이후)에 쓰는 identity-service 주소.
identity-service:
  url: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
  connect-timeout-ms: ${IDENTITY_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${IDENTITY_SERVICE_READ_TIMEOUT_MS:3000}

# MSA 전환 Phase 12 패턴 재사용: 분산 트레이싱(TracingConfig 참고).
management:
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
