# 실배포 워크플로우
# main에 push될 때만 이미지를 빌드해 ECR에 push하고, ArgoCD가 배포
name: Study Service Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC로 ECR push용 IAM 역할을 assume하기 위해 필요

jobs:
  # study-service가 의존하는 identity-service와의 두 계약(선호 태그 조회 TagPreferenceClient,
  # 이름 배치 조회 UserServiceClient — client-common 소속)이 실제 응답 모양과 어긋나지 않는지 검증
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run identity-service client contract tests
        run: ./gradlew test --tests "*ContractTest" --tests "*TracePropagationTest" --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

  study-service:
    needs: contract-test
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::665206375378:role/groovy-github-actions-ecr-role
          aws-region: ap-northeast-2

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push study-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Dockerfile build stage 의 gradle 이 groovy-common(GitHub Packages)을 받도록 인증 주입.
          # BuildKit secret 이라 이미지 레이어에 남지 않는다.
          secrets: |
            gpr_actor=${{ github.actor }}
            gpr_token=${{ secrets.GPR_TOKEN }}
          platforms: linux/arm64
          # sha 태그만 쓴다(:latest 같은 가변 태그 없음) — GitOps는 groovy-infra의 values.yaml에
          # 박힌 정확한 태그로만 배포 대상을 판단하므로, 가변 태그가 있으면 오히려 혼란만 준다.
          tags: ${{ steps.ecr-login.outputs.registry }}/groovy-study-service:${{ github.sha }}
          cache-from: type=gha,scope=study-service
          cache-to: type=gha,mode=max,scope=study-service

      # 여기서부터 CD 연결 — groovy-infra의 main 브랜치에 있는 이 서비스의 values.yaml 이미지
      # 태그를 새로 push한 sha로 갱신해 커밋한다.
      - name: Checkout groovy-infra
        uses: actions/checkout@v4
        with:
          repository: KDT-Team26/groovy-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: groovy-infra

      - name: Bump image tag in groovy-infra
        working-directory: groovy-infra
        run: |
          sed -i -E "s/^(    tag: ).*/\1\"${{ github.sha }}\"/" helm/study-service/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/study-service/values.yaml
          if git diff --cached --quiet; then
            echo "이미지 태그가 이미 최신 상태라 커밋할 변경 사항이 없습니다."
          else
            git commit -m "chore(study-service): bump image tag to ${{ github.sha }}"
            git push
          fi
