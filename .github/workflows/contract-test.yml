# Phase 01(Groovy GitOps 빌드 지시서) — dev 전용 테스트 CI.
# main 트리거인 build-and-deploy.yml과 독립된 워크플로다.
# dev push/PR에서는 이미지 빌드·push 없이 contract-test만 수행한다 — Docker Hub 시크릿 불필요.
name: CI Test

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  # study-service가 의존하는 identity-service와의 두 계약(선호 태그 조회 TagPreferenceClient,
  # 이름 배치 조회 UserServiceClient — client-common 소속)이 실제 응답 모양과 어긋나지 않는지
  # 검증한다. 로컬 스텁 HTTP 서버로 응답을 흉내내는 순수 단위 테스트라 별도 인프라 없이 돈다.
  # --tests 필터를 루트 레벨로 걸어 libs:client-common과 services:study-service 양쪽의
  # *ContractTest를 한 번에 실행한다.
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run identity-service client contract tests
        run: ./gradlew test --tests "*ContractTest" --tests "*TracePropagationTest" --no-daemon
        env:
          # groovy-common(공통 모듈)을 GitHub Packages 에서 내려받기 위한 인증
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
